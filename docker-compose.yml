services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shiftguard
      POSTGRES_PASSWORD: shiftguard
      POSTGRES_DB: shiftguard
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: shiftguard
      MINIO_ROOT_PASSWORD: shiftguard-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://shiftguard:shiftguard@db:5432/shiftguard
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: [db, redis]
    profiles: [full]

  worker:
    build: ./apps/api
    command: arq app.workers.tasks.WorkerSettings
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://shiftguard:shiftguard@db:5432/shiftguard
      REDIS_URL: redis://redis:6379/0
    depends_on: [db, redis]
    profiles: [full]

volumes:
  pgdata:
  miniodata:
