services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shiftguard
      POSTGRES_PASSWORD: shiftguard
      POSTGRES_DB: shiftguard
    # Port côté PC configurable (DB_PORT dans .env) : sous Windows, 5432 est parfois réservé.
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # Stockage S3-compatible (documents des agents). Utile à partir du M3 :
  # docker compose --profile storage up -d
  # MinIO n'est plus publié sur Docker Hub depuis 2026, remplacé par SeaweedFS.
  storage:
    image: chrislusf/seaweedfs:4.47
    command: server -dir=/data -s3 -s3.port=8333
    ports: ["8333:8333"]
    volumes: [s3data:/data]
    profiles: [storage, full]

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://shiftguard:shiftguard@db:5432/shiftguard
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: [db, redis]
    profiles: [full]

  worker:
    build: ./apps/api
    command: arq app.workers.tasks.WorkerSettings
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://shiftguard:shiftguard@db:5432/shiftguard
      REDIS_URL: redis://redis:6379/0
    depends_on: [db, redis]
    profiles: [full]

volumes:
  pgdata:
  s3data:
