[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftguard-api"
version = "0.1.0"
description = "API ShiftGuard : recrutement WhatsApp, planning des shifts et pointage"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.162,<0.163",
  "sqlalchemy>=2.1,<2.2",
  "alembic>=1.20,<1.21",
  "psycopg[binary]>=3.3,<3.4",
  "pydantic-settings>=2.16,<2.17",
  "arq>=0.28,<0.29",
  "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = ["pytest>=9.2", "ruff>=0.15"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends() dans les signatures FastAPI
